<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Seu Nome — Dev Fullstack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e4162b"/><stop offset=".62" stop-color="#e4162b"/><stop offset="1" stop-color="#7a0c18"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".45"/></pattern>
    <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#f2c230"/><rect x="14" width="14" height="28" fill="#08080a"/>
    </pattern>
    <clipPath id="cap"><rect x="48" y="28" width="34" height="14" rx="7"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace}
    .disp{font-family:Impact,'Haettenschweiz','Arial Narrow Bold','Arial Black',sans-serif}
    .cur{animation:blink 1s steps(2) infinite}
    .jit{animation:jit 5s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes jit{0%,91%,100%{transform:translate(0,0)}93%{transform:translate(-6px,2px)}96%{transform:translate(5px,-2px)}}
  </style>

  <rect width="1000" height="320" fill="#08080a"/>
  <circle cx="800" cy="165" r="190" fill="#e4162b" opacity=".55" filter="url(#glow)"/>
  <circle cx="800" cy="165" r="190" fill="url(#sun)"/>
  <g fill="#08080a">
    <rect x="600" y="205" width="400" height="3"/><rect x="600" y="226" width="400" height="5"/>
    <rect x="600" y="248" width="400" height="7"/><rect x="600" y="271" width="400" height="9"/>
  </g>

  <g clip-path="url(#cap)"><rect x="48" y="28" width="17" height="14" fill="#e4162b"/><rect x="65" y="28" width="17" height="14" fill="#ece6d8"/></g>
  <text x="96" y="40" class="mono" font-size="14" fill="#e4162b" letter-spacing="4">NEO-TOKYO // 2026</text>

  <text x="44" y="174" class="disp jit" font-size="112" fill="#7a0c18" textLength="470" lengthAdjust="spacingAndGlyphs">SEU NOME</text>
  <text x="40" y="170" class="disp" font-size="112" fill="#ece6d8" textLength="470" lengthAdjust="spacingAndGlyphs">SEU NOME</text>

  <rect x="40" y="194" width="262" height="36" fill="#e4162b"/>
  <text x="52" y="221" class="disp" font-size="26" fill="#08080a" letter-spacing="3" textLength="238" lengthAdjust="spacingAndGlyphs">DEV FULLSTACK</text>

  <text x="42" y="264" class="mono" font-size="16" fill="#ece6d8" textLength="500" lengthAdjust="spacing">.NET  /  REACT  /  NEXT.JS  /  REACT NATIVE</text>
  <rect class="cur" x="552" y="251" width="9" height="16" fill="#e4162b"/>

  <text transform="translate(962,34)" writing-mode="tb" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="16" fill="#ece6d8" letter-spacing="8" opacity=".85">ネオ東京 開発者</text>

  <rect width="1000" height="320" fill="url(#sl)"/>
  <rect width="1000" height="3" fill="#e4162b"/>
  <rect y="306" width="1000" height="14" fill="url(#hz)"/>
</svg>
